name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Submit IndexNow
        run: |
          echo "📡 Fetching IndexNow payload from /api/indexnow.json..."
          PAYLOAD=$(curl -sf "https://www.techmeout.it/api/indexnow.json")
          if [ -z "$PAYLOAD" ]; then
            echo "⚠️ API not yet available, using sitemap fallback"
            URLS=$(grep -oP '(?<=<loc>)[^<]+' public/sitemap.xml)
            URL_JSON=$(echo "$URLS" | jq -R -s 'split("\n") | map(select(length > 0))')
            PAYLOAD=$(jq -n \
              --arg host "www.techmeout.it" \
              --arg key "ee35bd410c8940c1a29f23f1c772c599" \
              --arg keyLoc "https://www.techmeout.it/ee35bd410c8940c1a29f23f1c772c599.txt" \
              --argjson urls "$URL_JSON" \
              '{host: $host, key: $key, keyLocation: $keyLoc, urlList: $urls}')
          fi
          echo "$PAYLOAD" | jq .
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          echo "✅ IndexNow response: HTTP $HTTP_CODE"
          echo "📊 Submitted $(echo "$PAYLOAD" | jq '.urlList | length') URLs"
