name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Submit IndexNow
        run: |
          URLS=$(grep -oP '(?<=<loc>)[^<]+' public/sitemap.xml)
          URL_JSON=$(echo "$URLS" | jq -R -s 'split("\n") | map(select(length > 0))')
          curl -s -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json" \
            -d "{
              \"host\": \"www.techmeout.it\",
              \"key\": \"ee35bd410c8940c1a29f23f1c772c599\",
              \"keyLocation\": \"https://www.techmeout.it/ee35bd410c8940c1a29f23f1c772c599.txt\",
              \"urlList\": $URL_JSON
            }"
          echo ""
          echo "✅ Submitted $(echo "$URLS" | wc -l) URLs to IndexNow"
